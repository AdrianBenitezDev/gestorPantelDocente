<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activar Plan - PanelDocente</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="top-banner">
    <div class="brand-block">
      <span class="brand-icon" aria-hidden="true">&#127891;</span>
      <span class="brand-name">PanelDocente</span>
    </div>
    <div class="user-block">
      <div class="user-meta">
        <span class="user-icon" aria-hidden="true">&#128100;</span>
        <span id="activar-user-name" class="user-name">Sin sesion</span>
        <span id="activar-user-email" class="user-email">-</span>
      </div>
      <button id="activar-logout-btn" type="button" class="google-btn">Cerrar sesion</button>
    </div>
  </header>

  <main class="app">
    <section class="card">
      <h1>Activar Plan</h1>
      <p class="subtitle">Tu usuario existe, pero necesitas activar tu suscripcion para ingresar.</p>
      <p class="msg">Plan disponible: <strong>Plan Pro - ARS 2000 / mes</strong></p>
      <p id="activar-status-msg" class="msg"></p>
      <div class="review-actions">
        <button id="activar-subscribe-btn" type="button">Suscribirme</button>
        <a href="/estado-suscripcion.html" class="link-btn">Ver estado</a>
        <a href="/horarios.html" class="link-btn">Volver</a>
      </div>
    </section>
  </main>

  <div id="shared-footer-root"></div>
  <script src="./footer/footer.js" defer></script>
  <script type="module" src="./js/activarPlan.js"></script>
</body>
</html>
