<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon/paneldocente.png?v=20260318-2" />
  <link rel="stylesheet" href="./css/styles.css?v=20260318-theme1" />
  <link rel="stylesheet" href="./publicidad/stockfacil-banner.css" />
  <link rel="preload" as="image" href="./publicidad/banner_1.webp" fetchpriority="high" />
</head>
<body class="registro-page">
  <main class="app registro-wrap">
    <header class="header registro-header">
      <h1>PanelDocente</h1>
      <p class="subtitle">Registro</p>
    </header>

    <section class="card registro-card">
      <h2>Registro</h2>
      <div class="card registro-plan-card">
        <h3>Plan Profesional</h3>
        <p class="msg registro-plan-msg">-El uso de la plataforma tiene un consto mensual fijo de 3.000$</p>
        <p class="msg registro-plan-msg">-PanelDocente gestiona la creaci&oacute;n de PAC, ahorr&aacute;ndote horas de trabajo</p>
      </div>
      <form id="register-form" class="grid-form registro-grid">
        <label>
          <span class="registro-field-label">
            <span class="registro-field-icon" aria-hidden="true">&#128205;</span>
            <span>Distrito</span>
          </span>
          <input id="reg-distrito" required placeholder="Ejemplo: 004" />
        </label>
        <label>
          <span class="registro-field-label">
            <span class="registro-field-icon" aria-hidden="true">&#127891;</span>
            <span>Nivel</span>
          </span>
          <input id="reg-nivel" required placeholder="Ejemplo: Secundario" />
        </label>
        <label>
          <span class="registro-field-label">
            <span class="registro-field-icon" aria-hidden="true">&#127979;</span>
            <span>N&uacute;mero de escuela</span>
          </span>
          <input id="reg-escuela" required placeholder="Ejemplo: 26" />
        </label>
        <label>
          <span class="registro-field-label">
            <span class="registro-field-icon" aria-hidden="true">&#128100;</span>
            <span>Apellido y nombre</span>
          </span>
          <input id="reg-nombre" required placeholder="Ejemplo: Adri&aacute;n Ben&iacute;tez" />
        </label>
        <label>
          <span class="registro-field-label">
            <span class="registro-field-icon" aria-hidden="true">&#128222;</span>
            <span>N&uacute;mero de contacto</span>
          </span>
          <input id="reg-contacto" required placeholder="Ejemplo: 11 4297-2500" />
        </label>
        <label>
          <span class="registro-field-label">
            <span class="registro-field-icon" aria-hidden="true">&#128231;</span>
            <span>Correo institucional</span>
          </span>
          <input
            id="reg-correo"
            type="email"
            required
            autocomplete="email"
            placeholder="secundaria...@abc.gob.ar"
          />
        </label>
        <label>
          <span class="registro-field-label">
            <span class="registro-field-icon" aria-hidden="true">&#128233;</span>
            <span>Correo alternativo</span>
          </span>
          <input id="reg-correo-alt" type="email" placeholder="Ejemplo: usuario@gmail.com" />
        </label>
        <input id="reg-plan-code" type="hidden" value="plan_pro" />
        <div class="registro-submit-wrap">
          <button type="submit" class="registro-submit-btn">Crear cuenta</button>
        </div>
      </form>
      <p id="register-msg" class="msg"></p>
      <p class="msg registro-login-msg">&iquest;Ya tienes cuenta? <a href="/index.html">Ir a login</a></p>
    </section>
  </main>

  <div id="stockfacil-banner-slot">
    <div class="stockfacil-modal-overlay" id="stockfacilModal" aria-hidden="false">
      <div class="stockfacil-modal" role="region" aria-label="Publicidad Stock Facil">
        <span class="stockfacil-modal-tag">Publicidad</span>
        <div class="stockfacil-carousel">
          <button type="button" class="stockfacil-nav prev" id="stockfacilPrev" aria-label="Imagen anterior">&#8249;</button>
          <a class="stockfacil-modal-link" href="https://stockfacil.com.ar" target="_blank" rel="noopener noreferrer sponsored" aria-label="Ir a Stock Facil">
            <img
              id="stockfacilModalImage"
              class="stockfacil-modal-image"
              src="./publicidad/banner_1.webp"
              alt="Stock Facil banner 1"
              width="2048"
              height="682"
              loading="eager"
              fetchpriority="high"
              decoding="async"
            />
          </a>
          <button type="button" class="stockfacil-nav next" id="stockfacilNext" aria-label="Imagen siguiente">&#8250;</button>
        </div>
        <div class="stockfacil-indicators">
          <button type="button" class="stockfacil-dot is-active" aria-label="Ir al banner 1"></button>
          <button type="button" class="stockfacil-dot" aria-label="Ir al banner 2"></button>
          <button type="button" class="stockfacil-dot" aria-label="Ir al banner 3"></button>
        </div>
      </div>
    </div>
  </div>
  <div id="shared-footer-root"></div>
  <script src="./footer/footer.js" defer></script>
  <script type="module" src="./js/registro.js?v=20260502-registro-fix1"></script>
  <script src="./publicidad/stockfacil-banner.js" defer></script>
</body>
</html>
