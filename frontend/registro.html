<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - PanelDocente</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="registro-page">
  <main class="app registro-wrap">
    <header class="header registro-header">
      <h1>PanelDocente</h1>
      <p class="subtitle">Registro</p>
    </header>

    <section class="card registro-card">
      <h2>Registro</h2>
      <div class="card registro-plan-card">
        <h3>Plan seleccionado</h3>
        <p class="subtitle">Plan Pro - ARS 2000 / mes</p>
        <p class="msg registro-plan-msg">-El uso de la plataforma tiene un consto fijo mensual de 2.000$</p>
        <p class="msg registro-plan-msg">-PanelDocente gestiona la creaci&oacute;n de PAC, ahorr&aacute;ndote horas de trabajo</p>
      </div>
      <form id="register-form" class="grid-form registro-grid">
        <label>
          Distrito
          <input id="reg-distrito" required placeholder="Ejemplo: 004" />
        </label>
        <label>
          Nivel
          <input id="reg-nivel" required placeholder="Ejemplo: Secundario" />
        </label>
        <label>
          N&uacute;mero de escuela
          <input id="reg-escuela" required placeholder="Ejemplo: 26" />
        </label>
        <label>
          Apellido y nombre
          <input id="reg-nombre" required placeholder="Ejemplo: Adri&aacute;n Ben&iacute;tez" />
        </label>
        <label>
          N&uacute;mero de contacto
          <input id="reg-contacto" required placeholder="Ejemplo: 11 4297-2500" />
        </label>
        <label>
          Correo institucional
          <input
            id="reg-correo"
            type="email"
            required
            autocomplete="email"
            placeholder="secundaria...@abc.gob.ar"
          />
        </label>
        <label>
          Correo alternativo
          <input id="reg-correo-alt" type="email" placeholder="Ejemplo: usuario@gmail.com" />
        </label>
        <label>
          Usuario
          <input id="reg-usuario" required placeholder="Ejemplo: adrian32" />
        </label>
        <label>
          Contrase&ntilde;a
          <input id="reg-password" type="password" minlength="8" required placeholder="M&iacute;nimo 8 caracteres" />
        </label>
        <input id="reg-plan-code" type="hidden" value="plan_pro" />
        <button type="submit">Crear cuenta</button>
      </form>
      <p id="register-msg" class="msg"></p>
      <p class="msg registro-login-msg">&iquest;Ya tienes cuenta? <a href="/horarios.html">Ir a login</a></p>
    </section>
  </main>

  <div id="shared-footer-root"></div>
  <script src="./footer/footer.js" defer></script>
  <script type="module" src="./js/registro.js"></script>
</body>
</html>
