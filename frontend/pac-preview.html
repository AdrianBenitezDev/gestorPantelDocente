<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon/paneldocente.png?v=20260318-2" />
  <link rel="stylesheet" href="./css/styles.css?v=20260318-theme1" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Vista previa PAC</h1>
      <p class="subtitle" id="pac-preview-subtitle">Se muestran solo las filas seleccionadas.</p>
      <div class="review-actions">
        <button id="preview-save-btn" type="button">Guardar en Google Drive</button>
        <button id="preview-download-btn" type="button" class="google-btn">Descargar</button>
        <button id="preview-cancel-btn" type="button" class="google-btn">Cancelar</button>
      </div>
      <p id="preview-msg" class="msg"></p>
      <a
        id="preview-open-drive-btn"
        class="link-btn pac-drive-link-btn is-hidden"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        hidden
      >
        <span class="pac-drive-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
            <path fill="#0F9D58" d="M8.1 3.6h7.8l3.4 5.8h-7.8z" />
            <path fill="#4285F4" d="M5.3 9.4L9.2 3l3.9 6.4-3.9 6.5z" />
            <path fill="#F4B400" d="M13.1 9.4h7.4L16.5 16H9.2z" />
          </svg>
        </span>
        <span>Ir a la planilla guardada en Drive</span>
      </a>
    </section>

    <section class="card">
      <div class="pac-table-wrap">
        <table class="pac-table">
          <thead>
            <tr>
              <th>CUPOF</th>
              <th>CUIL</th>
              <th></th>
              <th></th>
              <th>SEC</th>
              <th>FECHA NAC</th>
              <th>APELLIDO Y NOMBRE</th>
              <th>REV</th>
              <th>MOD./CARR.</th>
              <th>ESP CUR/ ASIG</th>
              <th>HS/MOD/CAR</th>
              <th>FUNCION</th>
              <th>AÑO</th>
              <th>SECCION</th>
            </tr>
            <tr>
              <th></th>
              <th></th>
              <th>DNI</th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="preview-results-body">
            <tr>
              <td colspan="14">Sin datos</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="shared-footer-root"></div>
  <script src="./footer/footer.js" defer></script>
  <script type="module" src="./js/pacPreview.js"></script>
</body>
</html>
